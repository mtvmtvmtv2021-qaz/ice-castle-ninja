<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>こおりの城のニンジャ | ブラウザで遊べる3Dアクション</title>
<meta name="description" content="ブラウザで遊べる無料3Dアクションゲーム。ニンジャになって2段ジャンプ・カベキック・カギ爪ロープを使い、こおりの城の天守をめざそう！">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#0d1530;font-family:"Hiragino Maru Gothic ProN","M PLUS Rounded 1c","Yu Gothic UI","Meiryo",sans-serif;color:#fff;user-select:none;-webkit-user-select:none;touch-action:none}
canvas{display:block;width:100%;height:100%}
#stats{position:fixed;top:14px;left:16px;font-size:18px;font-weight:bold;text-shadow:0 2px 6px rgba(0,20,60,.8);display:flex;gap:18px;pointer-events:none}
#toast{position:fixed;top:18%;left:50%;transform:translateX(-50%);font-size:30px;font-weight:bold;color:#fff;text-shadow:0 0 14px #5cf,0 3px 8px rgba(0,0,0,.6);opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
#hint{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);max-width:92vw;text-align:center;font-size:17px;background:rgba(10,30,70,.6);border:1px solid rgba(160,220,255,.5);padding:10px 20px;border-radius:14px;opacity:0;transition:opacity .3s;pointer-events:none;backdrop-filter:blur(4px)}
#hookTip{position:fixed;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;border:3px solid #8ef;background:rgba(40,140,255,.35);font-weight:bold;font-size:15px;display:none;align-items:center;justify-content:center;pointer-events:none;box-shadow:0 0 12px #6cf;animation:pulse .8s infinite alternate}
@keyframes pulse{from{transform:scale(.9)}to{transform:scale(1.12)}}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .35s}
.panel{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,rgba(20,40,90,.55),rgba(5,10,30,.85));backdrop-filter:blur(3px);z-index:10}
.card{text-align:center;padding:30px 20px;max-width:720px;width:96vw}
.title{white-space:nowrap;font-size:clamp(26px,6.4vw,54px);font-weight:900;letter-spacing:.06em;color:#fff;text-shadow:0 0 18px #6cf,0 0 40px #39f,0 4px 0 #1a3a7a}
.sub{font-size:15px;letter-spacing:.4em;color:#bfe6ff;margin:6px 0 22px}
.how{display:grid;grid-template-columns:auto 1fr;gap:7px 16px;text-align:left;background:rgba(255,255,255,.07);border:1px solid rgba(170,220,255,.3);border-radius:14px;padding:16px 20px;font-size:15px;margin:0 auto 22px;max-width:460px}
.how b{color:#9de4ff;white-space:nowrap}
.btn{font:inherit;font-size:22px;font-weight:bold;color:#0b2350;background:linear-gradient(#e8fbff,#8fdcff);border:none;border-radius:40px;padding:13px 46px;cursor:pointer;box-shadow:0 0 20px rgba(120,210,255,.7),0 5px 0 #3a86c0;transition:transform .1s}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(3px);box-shadow:0 0 20px rgba(120,210,255,.7),0 2px 0 #3a86c0}
.best{margin-top:14px;color:#cdeeff;font-size:15px;min-height:1em}
.result{font-size:22px;line-height:1.9;margin:14px 0 22px}
.result .big{font-size:40px;font-weight:900;color:#ffe680;text-shadow:0 0 14px #fa0}
.hidden{display:none!important}
#mute{position:fixed;top:10px;right:12px;font-size:22px;background:rgba(10,30,70,.5);border:1px solid rgba(160,220,255,.4);color:#fff;border-radius:10px;padding:4px 10px;cursor:pointer;z-index:5}
#touch{position:fixed;inset:0;pointer-events:none;z-index:4}
#joy{position:fixed;width:120px;height:120px;border-radius:50%;border:2px solid rgba(255,255,255,.35);background:rgba(255,255,255,.08);display:none;margin:-60px 0 0 -60px}
#joyK{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;background:rgba(200,240,255,.5)}
.tbtn{position:fixed;pointer-events:auto;width:78px;height:78px;border-radius:50%;border:2px solid rgba(200,240,255,.6);background:rgba(40,120,220,.35);color:#fff;font:inherit;font-weight:bold;font-size:15px}
#tJump{right:22px;bottom:28px;width:92px;height:92px}
#tHook{right:128px;bottom:20px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="stats"><span id="sTime">⏱ 0:00.0</span><span id="sDeath">💀 0</span><span id="sScroll">📜 0/5</span></div>
<div id="toast"></div>
<div id="hint"></div>
<div id="hookTip">E</div>
<div id="flash"></div>
<button id="mute" title="音のオン/オフ (M)">🔊</button>

<div id="touch" class="hidden">
  <div id="joy"><div id="joyK"></div></div>
  <button class="tbtn" id="tHook">フック</button>
  <button class="tbtn" id="tJump">ジャンプ</button>
</div>

<div id="title" class="panel">
  <div class="card">
    <div class="title">こおりの城のニンジャ</div>
    <div class="sub">ICE CASTLE NINJA</div>
    <div class="how">
      <b>移動</b><span>WASD ／ 矢印キー</span>
      <b>ジャンプ</b><span>Space（空中でもう一度で2段ジャンプ）</span>
      <b>カベキック</b><span>カベにふれたまま Space</span>
      <b>カギ爪ロープ</b><span>青いクリスタルの近くで E ／ クリック</span>
      <b>カメラ</b><span>マウス（画面をクリックで固定）／ J・L キー</span>
      <b>やり直し</b><span>R（チェックポイントへ）</span>
    </div>
    <button class="btn" id="startBtn">スタート</button>
    <div class="best" id="bestTitle"></div>
  </div>
</div>

<div id="clear" class="panel hidden">
  <div class="card">
    <div class="title">天守にとうちゃく！</div>
    <div class="sub">STAGE CLEAR</div>
    <div class="result" id="result"></div>
    <button class="btn" id="againBtn">もう一度あそぶ</button>
  </div>
</div>

<script>
'use strict';
// =====================================================================
//  こおりの城のニンジャ  —  WebGL 3D アクション（外部ライブラリなし）
// =====================================================================
const cv = document.getElementById('c');
const gl = cv.getContext('webgl', { antialias: true });
if (!gl) { document.body.innerHTML = '<p style="padding:30px;font-size:20px">このブラウザはWebGLに対応していないため遊べません。ChromeやEdge、Safariの最新版でお試しください。</p>'; throw new Error('no webgl'); }

// ---------------- 行列 ----------------
const mI = () => { const m = new Float32Array(16); m[0] = m[5] = m[10] = m[15] = 1; return m; };
const mC = a => new Float32Array(a);
function mMul(a, b) { const o = new Float32Array(16); for (let c = 0; c < 4; c++) for (let r = 0; r < 4; r++) { let s = 0; for (let k = 0; k < 4; k++) s += a[k * 4 + r] * b[c * 4 + k]; o[c * 4 + r] = s; } return o; }
function mT(m, x, y, z) { for (let r = 0; r < 4; r++) m[12 + r] += m[r] * x + m[4 + r] * y + m[8 + r] * z; return m; }
function mRY(m, a) { const c = Math.cos(a), s = Math.sin(a); for (let r = 0; r < 4; r++) { const a0 = m[r], a2 = m[8 + r]; m[r] = a0 * c - a2 * s; m[8 + r] = a0 * s + a2 * c; } return m; }
function mRX(m, a) { const c = Math.cos(a), s = Math.sin(a); for (let r = 0; r < 4; r++) { const a1 = m[4 + r], a2 = m[8 + r]; m[4 + r] = a1 * c + a2 * s; m[8 + r] = -a1 * s + a2 * c; } return m; }
function mRZ(m, a) { const c = Math.cos(a), s = Math.sin(a); for (let r = 0; r < 4; r++) { const a0 = m[r], a1 = m[4 + r]; m[r] = a0 * c + a1 * s; m[4 + r] = -a0 * s + a1 * c; } return m; }
function mS(m, x, y, z) { for (let r = 0; r < 4; r++) { m[r] *= x; m[4 + r] *= y; m[8 + r] *= z; } return m; }
function persp(fov, asp, n, f) { const t = 1 / Math.tan(fov / 2), nf = 1 / (n - f); return new Float32Array([t / asp, 0, 0, 0, 0, t, 0, 0, 0, 0, (f + n) * nf, -1, 0, 0, 2 * f * n * nf, 0]); }
function lookAt(e, c, u) {
  let zx = e[0] - c[0], zy = e[1] - c[1], zz = e[2] - c[2]; let l = Math.hypot(zx, zy, zz); zx /= l; zy /= l; zz /= l;
  let xx = u[1] * zz - u[2] * zy, xy = u[2] * zx - u[0] * zz, xz = u[0] * zy - u[1] * zx; l = Math.hypot(xx, xy, xz); xx /= l; xy /= l; xz /= l;
  const yx = zy * xz - zz * xy, yy = zz * xx - zx * xz, yz = zx * xy - zy * xx;
  return new Float32Array([xx, yx, zx, 0, xy, yy, zy, 0, xz, yz, zz, 0, -(xx * e[0] + xy * e[1] + xz * e[2]), -(yx * e[0] + yy * e[1] + yz * e[2]), -(zx * e[0] + zy * e[1] + zz * e[2]), 1]);
}
function xform(m, x, y, z) { return [m[0] * x + m[4] * y + m[8] * z + m[12], m[1] * x + m[5] * y + m[9] * z + m[13], m[2] * x + m[6] * y + m[10] * z + m[14], m[3] * x + m[7] * y + m[11] * z + m[15]]; }

// ---------------- シェーダー ----------------
function prog(vs, fs) {
  const mk = (t, s) => { const sh = gl.createShader(t); gl.shaderSource(sh, s); gl.compileShader(sh); if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(sh)); return sh; };
  const p = gl.createProgram(); gl.attachShader(p, mk(gl.VERTEX_SHADER, vs)); gl.attachShader(p, mk(gl.FRAGMENT_SHADER, fs)); gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  const u = {}; const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS); for (let i = 0; i < n; i++) { const nm = gl.getActiveUniform(p, i).name; u[nm] = gl.getUniformLocation(p, nm); }
  return { p, u, a: (nm) => gl.getAttribLocation(p, nm) };
}
const MAIN = prog(`
attribute vec3 aPos; attribute vec3 aNor;
uniform mat4 uProj, uView, uModel; uniform vec3 uScale;
varying vec3 vN; varying vec3 vW;
void main(){ vec4 w = uModel*vec4(aPos,1.0); vW = w.xyz;
  mat3 m = mat3(uModel[0].xyz, uModel[1].xyz, uModel[2].xyz);
  vN = m*(aNor/(uScale*uScale)); gl_Position = uProj*uView*w; }`, `
precision mediump float;
uniform vec3 uColor, uSun, uCam, uFog; uniform float uAlpha, uSpec, uEmis, uFogD;
varying vec3 vN; varying vec3 vW;
void main(){
  vec3 n = normalize(vN); vec3 v = normalize(uCam - vW);
  float d = max(dot(n, uSun), 0.0); float hemi = 0.55 + 0.45*n.y;
  vec3 col = uColor*(0.66*hemi*vec3(0.8,0.9,1.1) + 0.6*d*vec3(1.0,0.96,0.9));
  vec3 h = normalize(uSun + v);
  col += uSpec*pow(max(dot(n,h),0.0), 40.0)*vec3(1.0);
  col += uSpec*0.45*pow(1.0 - max(dot(n,v),0.0), 3.0)*vec3(0.7,0.92,1.0);
  col = mix(col, uColor, uEmis);
  float dist = length(uCam - vW);
  float f = 1.0 - exp(-pow(dist*uFogD, 1.6));
  col = mix(col, uFog, clamp(f, 0.0, 1.0));
  gl_FragColor = vec4(col, uAlpha);
}`);
const SKY = prog(`
attribute vec2 aP; varying vec2 vP; void main(){ vP = aP; gl_Position = vec4(aP, 0.999, 1.0); }`, `
precision mediump float; varying vec2 vP; uniform float uH, uYaw, uTime; uniform vec3 uTop, uHor;
void main(){
  float t = clamp((vP.y - uH)*0.75, 0.0, 1.0);
  vec3 col = mix(uHor, uTop, pow(t, 0.65));
  float x = vP.x*0.8 - uYaw*1.3;
  float band = exp(-pow((vP.y - uH - 0.62 - 0.09*sin(x*2.3 + uTime*0.25) - 0.05*sin(x*5.1 - uTime*0.4))*7.0, 2.0));
  col += vec3(0.25,0.95,0.7)*band*0.22*(0.6+0.4*sin(x*3.0+uTime*0.3));
  if (vP.y < uH) col = mix(uHor, uHor*0.9, clamp((uH - vP.y)*2.0, 0.0, 1.0));
  gl_FragColor = vec4(col, 1.0);
}`);
const PTS = prog(`
attribute vec3 aPos; uniform mat4 uProj, uView; uniform float uSize;
void main(){ vec4 p = uView*vec4(aPos,1.0); gl_Position = uProj*p; gl_PointSize = clamp(uSize/max(-p.z,0.1), 1.0, 7.0); }`, `
precision mediump float; uniform vec4 uCol;
void main(){ vec2 c = gl_PointCoord - 0.5; float d = dot(c,c); if (d > 0.25) discard; gl_FragColor = vec4(uCol.rgb, uCol.a*(1.0 - d*3.0)); }`);

// 立方体（-0.5〜0.5）
const cubeBuf = (() => {
  const P = [], N = [], I = [];
  const faces = [[0, 0, 1], [0, 0, -1], [1, 0, 0], [-1, 0, 0], [0, 1, 0], [0, -1, 0]];
  for (const n of faces) {
    const u = n[1] !== 0 ? [1, 0, 0] : [0, 1, 0];
    const w = [n[1] * u[2] - n[2] * u[1], n[2] * u[0] - n[0] * u[2], n[0] * u[1] - n[1] * u[0]];
    const b = P.length / 3;
    for (const [s, t] of [[-1, -1], [1, -1], [1, 1], [-1, 1]]) { P.push((n[0] + u[0] * s + w[0] * t) / 2, (n[1] + u[1] * s + w[1] * t) / 2, (n[2] + u[2] * s + w[2] * t) / 2); N.push(...n); }
    I.push(b, b + 1, b + 2, b, b + 2, b + 3);
  }
  const pb = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, pb); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(P), gl.STATIC_DRAW);
  const nb = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, nb); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(N), gl.STATIC_DRAW);
  const ib = gl.createBuffer(); gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ib); gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint16Array(I), gl.STATIC_DRAW);
  return { pb, nb, ib, n: I.length };
})();
const skyBuf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, skyBuf); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
const SNOW_N = 700; const snowPos = new Float32Array(SNOW_N * 3);
const snowBuf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, snowBuf); gl.bufferData(gl.ARRAY_BUFFER, snowPos.byteLength, gl.DYNAMIC_DRAW);

// ---------------- 色と素材 ----------------
const COL = {
  stone: [.44, .49, .62], snowcap: [.95, .97, 1], ice: [.5, .85, 1], crumble: [.75, .92, 1], move: [.8, .56, .28], wood: [.5, .32, .2],
  roof: [.2, .34, .46], white: [.93, .92, .88], red: [.86, .17, .2], gold: [1, .78, .25], dark: [.12, .12, .17], mount: [.86, .91, 1], cloud: [.82, .88, .98], spike: [.8, .95, 1]
};
const MAT = { ice: { a: .72, s: 1 }, crumble: { a: .82, s: .8 }, gold: { s: .7, e: .15 }, spike: { s: .9 } };
const FOG = [.7, .8, .95], SKYTOP = [.1, .16, .4];
const SUN = (() => { const v = [.45, .8, .35]; const l = Math.hypot(...v); return v.map(x => x / l); })();

// ---------------- ステージ ----------------
const solids = [], decor = [], anchors = [], cps = [], scrolls = [], spikes = [], icicles = [], hints = [], movers = [], crumbles = [];
function box(x0, y0, z0, x1, y1, z1, type, list = solids, extra) { const o = Object.assign({ min: [x0, y0, z0], max: [x1, y1, z1], type, active: true }, extra); list.push(o); return o; }
function P(cx, top, cz, w, d, h = 1, type = 'snow', extra) { return box(cx - w / 2, top - h, cz - d / 2, cx + w / 2, top, cz + d / 2, type, solids, extra); }
function D(x0, y0, z0, x1, y1, z1, type) { return box(x0, y0, z0, x1, y1, z1, type, decor); }
function CP(x, y, z, face, lx = 1.8, lz = 0) { cps.push({ pos: [x, y, z], face, lan: [x + lx, y, z + lz], on: false }); }
function A(x, y, z, mode) { anchors.push({ pos: [x, y, z], mode }); }
function S(x, y, z) { scrolls.push({ pos: [x, y + .7, z], got: false }); }
function H(x, y, z, r, text) { hints.push({ pos: [x, y, z], r, text }); }
function C(cx, top, cz) { const o = P(cx, top, cz, 3, 3, .6, 'crumble', { cr: { st: 0, t: 0 } }); crumbles.push(o); }
function M(cx, top, cz, axis, a, b, period) { const o = P(cx, top, cz, 3, 3, .8, 'move', { mv: { axis, a, b, period, cur: a, d: 0 } }); movers.push(o); }
function SP(x, top, z0, z1) { spikes.push({ min: [x - .4, top, z0], max: [x + .4, top + .7, z1] }); }
function IC(x, z, off) { icicles.push({ x, z, off, top: 29.3, floor: 21, y: 29.3, vis: true, warn: 0 }); }
function tower(x, z, y0, h, w) {
  D(x - w / 2, y0, z - w / 2, x + w / 2, y0 + h, z + w / 2, 'stone');
  let y = y0 + h, ww = w * .85;
  for (let i = 0; i < 3; i++) {
    D(x - ww / 2, y, z - ww / 2, x + ww / 2, y + 2.6, z + ww / 2, 'white');
    D(x - ww / 2 - .9, y + 2.6, z - ww / 2 - .9, x + ww / 2 + .9, y + 3.2, z + ww / 2 + .9, 'roof');
    D(x - ww / 2 - .7, y + 3.2, z - ww / 2 - .7, x + ww / 2 + .7, y + 3.35, z + ww / 2 + .7, 'snowcap');
    y += 3.35; ww *= .72;
  }
  D(x - .3, y, z - .3, x + .3, y + 1.2, z + .3, 'gold');
}

// スタート地点
P(0, 0, 0, 16, 16, 4);
cps.push({ pos: [0, 0, -4], face: 0, lan: null, on: true });
H(0, 0, -3, 5.5, 'WASD／矢印キーで移動・Spaceでジャンプ　（マウスでカメラを回せるよ）');
D(-3.3, 0, 4.7, -2.7, 5, 5.3, 'red'); D(2.7, 0, 4.7, 3.3, 5, 5.3, 'red');
D(-4.2, 4.3, 4.65, 4.2, 4.75, 5.35, 'red'); D(-4.7, 5.1, 4.5, 4.7, 5.6, 5.5, 'dark'); D(-.25, 4.75, 4.8, .25, 5.1, 5.2, 'dark');
D(-6, -26, -6, 6, -4, 6, 'stone');
tower(-15, -2, -26, 30, 7); tower(15, -2, -26, 28, 7);

// 1: ジャンプ
P(0, 1.5, 11, 4, 4, 1.5);
P(0, 3, 16.5, 3, 3, 1.5);
P(3, 4.5, 21.5, 3, 3, 1.5);
P(0, 6, 26.5, 3, 3, 1.5);
P(0, 6, 33, 6, 6, 2); CP(0, 6, 33, 0);
H(0, 6, 33, 3.8, '空中でもう一度 Space → 2段ジャンプ！');
P(0, 7, 43, 4, 4, 1.5);
P(-6, 9, 40, 2, 2, 10, 'stone'); S(-6, 9, 40);

// 2: 氷の床
P(0, 7, 52, 3, 12, 1, 'ice');
P(6, 7, 59.5, 15, 3, 1, 'ice');
H(0, 7, 48.5, 3, '氷の床はツルツルすべるよ！');
P(8, 7.5, 52, 2, 2, 1, 'ice'); S(8, 7.5, 52);
P(17, 7, 59.5, 5, 5, 2); CP(17, 7, 58.5, 0);

// 3: カベキックのたてあな
P(17, 7, 65, 4, 6, 2);
box(14, 5, 62, 15, 15, 68, 'stone');
box(19, 5, 62, 20, 15, 68, 'stone');
box(14, 5, 68, 20, 15, 69, 'stone');
H(17, 7, 64.5, 3.2, 'カベに向かってジャンプ → カベにふれたまま Space でカベキック！');
S(14.5, 15, 65);
P(17, 15, 75, 6, 12, 1.5); CP(17, 15, 79, -Math.PI / 2, 0, 1.8);
H(17, 15, 79, 3.5, 'ひびの入った氷は乗るとくずれる！止まらずに走りぬけよう');

// 4: くずれる氷と動く足場
C(10.5, 15, 79); C(5.5, 15.5, 79); C(.5, 16, 79);
M(-5, 16.5, 79, 0, -5, -13, 6);
P(-19, 17, 79, 6, 6, 2); CP(-19, 17, 79, Math.PI);
H(-19, 17, 79, 3.5, '青いクリスタルの近くで E（またはクリック）→ カギ爪ロープ！');

// 5: カギ爪ロープ
A(-19, 24, 69, 'fling'); A(-19, 26, 56, 'fling'); A(-28, 27, 63, 'drop');
P(-28, 24, 63, 4, 4, 1); S(-28, 24, 63);
